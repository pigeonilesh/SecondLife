<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Life — Главная</title>
  <link rel="icon" href="img/icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/home.css">
  <link rel="stylesheet" href="CSS/challenges.css">
  
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="user-profile">
        <div class="avatar">НИ</div>
        <div class="user-info">
          <div class="greeting">С возвращением,</div>
          <div class="name">Никулин Илья</div>
        </div>
      </div>
      <button class="icon-btn" aria-label="Уведомления">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
    </header>

    <main class="main-content">
      <section class="balance-card">
        <div class="balance-header">
          <span class="balance-title">Ваш баланс</span>
          <span class="rank-badge">🏆 1 место в группе</span>
        </div>
        <div class="balance-amount">1 250 <span>Б</span></div>
        <button class="btn-action">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Сдать мусор по QR
        </button>
      </section>

      <section>
        <div class="section-header">
          <h2 class="section-title">Ближайший контейнер</h2>
          <span class="section-link">ул. Бари Галеева, 3А</span>
        </div>
        <div id="yandex-map" style="width: 100%; height: 180px; border-radius: var(--radius-card); border: 1px solid var(--border-color); overflow: hidden;"></div>
      </section>

      <section>
        <div class="section-header">
          <h2 class="section-title">Активные челленджи</h2>
          <a href="chel.html" class="section-link">Все</a>
        </div>
        <div class="challenges-grid"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="hh.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
      <a href="chel.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg><span>Челленджи</span></a>
      <div class="qr-scan-btn"><svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zM19 3h-4v2h4v4h2V5c0-1.1-.9-2-2-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg></div>
      <a href="jopa.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v8H2l10 10 10-10h-6zM4.21 9l7.79-7.79L19.79 9H4.21z"/></svg><span>Рейтинг</span></a>
      <a href="regit.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
    </nav>

    <div class="qr-modal" id="qr-modal">
      <div class="qr-modal-content">
        <div class="qr-modal-header">
          <h3>Отсканируйте QR-код</h3>
          <button class="qr-close-btn" id="close-qr-btn">&times;</button>
        </div>
        <div id="qr-reader"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="js/app-core.js"></script>
  <script src="js/qr.js"></script>
  <script>
    ymaps.ready(() => {
      const map = new ymaps.Map("yandex-map", {
        center: [55.7981, 49.1818],
        zoom: 16
      });
      const placemark = new ymaps.Placemark([55.7981, 49.1818], {
        balloonContent: '<strong>Экотрекер — МЦК-КТИТС</strong><br>ул. Бари Галеева, 3А'
      }, {
        preset: 'islands#greenEcoIcon'
      });
      map.geoObjects.add(placemark);
    });
  </script>
</body>
</html>
