<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Life — Вход в систему</title>
  <link rel="icon" href="img/icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <style>
    .login-container {
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      justify-content: center;
      min-height: 100vh;
    }
    .login-header {
      text-align: center;
    }
    .login-logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input {
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-btn);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--color-primary);
    }
    .btn-login {
      background-color: var(--color-primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-btn);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: var(--shadow-primary);
    }
    .demo-accounts {
      background: var(--bg-page);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .demo-accounts strong { color: var(--text-main); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">🌱</div>
        <h1 class="page-title">Second Life</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Информационная система экотрекера</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Выберите пользователя / Логин</label>
          <select id="user-select" class="form-input">
            <optgroup label="Преподаватели / Администрация">
              <option value="admin">Преподаватель (Админ) — admin@ktits.ru</option>
            </optgroup>
            <optgroup label="Студенты группы 323СИС (МЦК-КТИТС)">
              <option value="nikulin">Никулин Илья</option>
              <option value="gorlanova">Горланова Анастасия</option>
              <option value="ilin">Ильин Павел</option>
              <option value="hakimzyanova">Хакимзянова Ильзиля</option>
              <option value="khasanova">Хасанова Илюза</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password-input" class="form-input" value="1234" required>
        </div>

        <button type="submit" class="btn-login">Войти в систему</button>
      </form>

      <div class="demo-accounts">
        <strong>🔑 Демо-доступ:</strong><br>
        • Пароль для всех: <code>1234</code><br>
        • Выберите роль «Преподаватель» для доступа к панели администратора и выгрузке Excel.
      </div>
    </div>
  </div>

  <script src="js/app-core.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const userKey = document.getElementById('user-select').value;
      const password = document.getElementById('password-input').value;
      EcoCore.login(userKey, password);
    });
  </script>
</body>
</html>
