<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Life — Рейтинг</title>
  <link rel="icon" href="img/icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/leaderboard.css">
</head>
<body>

  <div class="app-container">
    
    <header class="header header-leaderboard">
      <h1 class="page-title">Рейтинг эко-активистов</h1>
      <div class="tabs-container">
        <button class="tab-btn active" id="tab-personal" onclick="switchRating('personal', this)">Личный</button>
        <button class="tab-btn" id="tab-group" onclick="switchRating('group', this)">Групповой</button>
      </div>
    </header>

    <main class="main-content">
      
      <!-- ПЬЕДЕСТАЛ -->
      <section class="pedestal-section" id="pedestal-block">
        <div class="pedestal-item rank-2">
          <div class="pedestal-avatar-wrap"><div class="pedestal-avatar">МК</div><span class="pedestal-medal">🥈</span></div>
          <div class="pedestal-name">Анастасия Г.</div>
          <div class="pedestal-score">1 420 <span>Б</span></div>
          <div class="pedestal-bar bar-silver"><span class="bar-rank">2</span></div>
        </div>

        <div class="pedestal-item rank-1">
          <div class="pedestal-crown">👑</div>
          <div class="pedestal-avatar-wrap"><div class="pedestal-avatar">ИН</div><span class="pedestal-medal">🥇</span></div>
          <div class="pedestal-name">Илья Н.</div>
          <div class="pedestal-score">1 250 <span>Б</span></div>
          <div class="pedestal-bar bar-gold"><span class="bar-rank">1</span></div>
        </div>

        <div class="pedestal-item rank-3">
          <div class="pedestal-avatar-wrap"><div class="pedestal-avatar">ИХ</div><span class="pedestal-medal">🥉</span></div>
          <div class="pedestal-name">Ильзиля Х.</div>
          <div class="pedestal-score">1 100 <span>Б</span></div>
          <div class="pedestal-bar bar-bronze"><span class="bar-rank">3</span></div>
        </div>
      </section>

      <!-- СПИСОК -->
      <section class="leaderboard-list"></section>

    </main>

    <!-- НАВИГАЦИЯ -->
    <nav class="bottom-nav">
      <a href="hh.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
      <a href="chel.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg><span>Челленджи</span></a>
      <div class="qr-scan-btn"><svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zM19 3h-4v2h4v4h2V5c0-1.1-.9-2-2-2x"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg></div>
      <a href="jopa.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v8H2l10 10 10-10h-6zM4.21 9l7.79-7.79L19.79 9H4.21z"/></svg><span>Рейтинг</span></a>
      <a href="regit.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
    </nav>

    <!-- QR MODAL -->
    <div class="qr-modal" id="qr-modal">
      <div class="qr-modal-content">
        <div class="qr-modal-header">
          <h3>Отсканируйте QR-код</h3>
          <button class="qr-close-btn" id="close-qr-btn">&times;</button>
        </div>
        <div id="qr-reader"></div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="js/app-core.js"></script>
  <script src="js/qr.js"></script>
  <script>
    function switchRating(type, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const pedestal = document.getElementById('pedestal-block');
      if (type === 'group') {
        pedestal.style.display = 'none';
      } else {
        pedestal.style.display = 'flex';
      }

      EcoCore.renderLeaderboard(type);
    }
  </script>
</body>
</html>
